stages:
  - test
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  KUBE_NAMESPACE: ml-service

before_script:
  - apt-get update && apt-get install -y python3-pip
  - pip3 install pytest

test:
  stage: test
  script:
    - pytest tests/
  only:
    - main

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
    - main

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - sed -i "s|image: .*|image: $IMAGE_TAG|" manifests/deployment.yaml
    - kubectl --kubeconfig $KUBECONFIG apply -f manifests/ -n $KUBE_NAMESPACE
  only:
    - main
  when: manual