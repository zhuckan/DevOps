stages:
  - test
  - export_model
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  KUBE_NAMESPACE: "ml-service"

test:
  stage: test
  image: python:3.9-slim
  script:
    - pip install --no-cache-dir -r requirements.txt pytest
    - pytest tests/
  only:
    - main

export_model:
  stage: export_model
  image: python:3.9-slim
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python export_model.py
  artifacts:
    paths:
      - model.pkl
    expire_in: 1 week
  only:
    - main

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_JOB_TOKEN\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $IMAGE_TAG --insecure --skip-tls-verify
  only:
    - main

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - sh ./deploy.sh
  only:
    - main
  when: manual
