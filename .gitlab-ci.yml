stages:
  - test
  - build
  - deploy

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  KUBE_NAMESPACE: "ml-service"

test:
  stage: test
  image: python:3.9-slim
  script:
    - pip install --no-cache-dir -r requirements.txt pytest
    - pytest tests/
  only:
    - main

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_JOB_TOKEN\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $IMAGE_TAG --insecure --skip-tls-verify
  only:
    - main

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl --kubeconfig "$KUBECONFIG" apply -f manifests/namespace.yaml
    - kubectl --kubeconfig "$KUBECONFIG" apply -f manifests/rbac.yaml
    - kubectl --kubeconfig "$KUBECONFIG" apply -f manifests/quota.yaml
    - kubectl --kubeconfig "$KUBECONFIG" apply -f manifests/limitrange.yaml
    - kubectl --kubeconfig "$KUBECONFIG" apply -f manifests/service.yaml
    - kubectl --kubeconfig "$KUBECONFIG" create secret docker-registry gitlab-registry --docker-server=$CI_REGISTRY --docker-username=$CI_REGISTRY_USER --docker-password=$CI_REGISTRY_PASSWORD --docker-email=ci@example.com -n $KUBE_NAMESPACE --dry-run=client -o yaml > /tmp/gitlab-registry-secret.yaml
    - kubectl --kubeconfig "$KUBECONFIG" apply -f /tmp/gitlab-registry-secret.yaml
    - sed "s|__CI_REGISTRY_IMAGE__|$CI_REGISTRY_IMAGE|g; s|__CI_COMMIT_SHORT_SHA__|$CI_COMMIT_SHORT_SHA|g" manifests/deployment.yaml > /tmp/deployment.yaml
    - kubectl --kubeconfig "$KUBECONFIG" apply -f /tmp/deployment.yaml
    - kubectl --kubeconfig "$KUBECONFIG" apply -f manifests/ingress.yaml
  only:
    - main
  when: manual
