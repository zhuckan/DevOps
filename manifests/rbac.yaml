apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-app
  namespace: ml-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ml-service
  name: ml-app-role
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: ml-service
  name: ml-app-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ml-app-role
subjects:
- kind: ServiceAccount
  name: ml-app
  namespace: ml-service